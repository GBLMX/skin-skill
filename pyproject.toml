[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-skin"
version = "3.5.0"
description = "Programmatic Minecraft player skin and texture generation: double-layer, Steve/Alex, realistic shading, materials, 3D rendering, block faces and item icons."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GBLMX" }]
keywords = ["minecraft", "skin", "texture", "pixel-art", "blockbench", "skinlib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=9.0",
]

[project.optional-dependencies]
# Fancier gradient noise (Simplex via opensimplex) as an opt-in extra.
# The default package ships a pure-Python Perlin implementation with zero
# dependencies beyond Pillow.
noise = ["opensimplex>=0.4"]

# Vanilla game data (PrismarineJS minecraft-data, via minebase). Large: the
# dependency embeds all of minecraft-data, ~330 MB installed. Opt in here when
# you want version-accurate registries, biome tint palettes and skin-format
# facts to line generation up with the real game.
gamedata = ["minebase>=0.3"]

[project.urls]
Homepage = "https://github.com/GBLMX/skin-skill"
Repository = "https://github.com/GBLMX/skin-skill"

[project.scripts]
mc-skin = "skinlib.cli:main"
skin-tool = "skinlib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
